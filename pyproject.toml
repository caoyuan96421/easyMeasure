[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "easymeasure"
version = "0.1.0"
description = "A generic framework for multi-dimensional automated measurement"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.22",
    "PySide6>=6.4",
    "pyqtgraph>=0.13",
    "h5py>=3.6",
    "python-pptx>=0.6.21",
    "matplotlib>=3.5",
    "pywin32>=306; sys_platform == 'win32'",   # append slides to a .pptx open in PowerPoint
    "aiohttp>=3.10",          # remote access gateway (HTTPS + secure WebSocket) and RemoteClient
    "cryptography>=41",      # self-signed TLS certificate for the gateway
    "nidaqmx>=0.9",          # NI DAQ drivers (ni6211, ni63xx); needs NI's NI-DAQmx runtime too
    "pyvisa>=1.12",          # GPIB / USB / LAN instruments; needs a VISA library (NI-VISA, Keysight IO)
    "pyserial>=3.5",         # serial ports (RS-232, Prologix GPIB-USB adapters)
]

[project.optional-dependencies]
# pure-Python VISA for computers without NI-VISA (LAN, USB-TMC, serial; GPIB needs linux-gpib)
hardware = ["pyvisa-py>=0.7"]
test = ["pytest>=7", "pytest-timeout>=2"]
# browser end-to-end test of the web frontend (then: python -m playwright install chromium)
webtest = ["playwright>=1.40"]
# documentation site (mkdocs serve / mkdocs build; published by .github/workflows/docs.yml)
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26", "mkdocs-gen-files>=0.5",
        "mkdocs-literate-nav>=0.6"]

[project.urls]
Documentation = "https://caoyuan96421.github.io/easyMeasure/"
Source = "https://github.com/caoyuan96421/easyMeasure"

[project.scripts]
easymeasure-backend = "easymeasure.backend.__main__:main"
easymeasure-remote = "easymeasure.remote.__main__:main"

[project.gui-scripts]
easymeasure = "easymeasure.frontend.__main__:main"

[tool.setuptools.packages.find]
include = ["easymeasure*"]

[tool.setuptools.package-data]
"easymeasure.remote" = ["web/*.html", "web/*.svg", "web/css/*.css", "web/js/*.js", "web/js/panels/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
