site_name: easyMeasure
site_description: A generic Python framework for multi-dimensional automated measurement
site_url: https://caoyuan96421.github.io/easyMeasure/
repo_url: https://github.com/caoyuan96421/easyMeasure
repo_name: caoyuan96421/easyMeasure
edit_uri: edit/main/docs/
copyright: MIT licensed

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_reference.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: sphinx
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            filters: ["!^_[^_]", "!^__(?!init__)"]
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            merge_init_into_class: true
            docstring_section_style: list
            heading_level: 2
            show_if_no_docstring: true

validation:
  links:
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

hooks:
  - docs/hooks.py

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

exclude_docs: |
  _driver_notes/
  gen_reference.py
  hooks.py

not_in_nav: |
  /reference/api/**
  /reference/drivers/**

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quick start: quickstart.md
      - Key ideas: concepts.md
  - Tutorials:
      - tutorials/index.md
      - "1: A Landau fan": tutorials/landau-fan.md
      - "2: Rotated gate sweeps": tutorials/rotated-gates.md
      - "3: Stop at a threshold": tutorials/stop-at-threshold.md
      - "4: A VNA power sweep": tutorials/vna-power.md
  - User guide:
      - guide/index.md
      - Building a setup:
          - Instruments: guide/instruments.md
          - Aliases and protection: guide/aliases.md
          - Composite channels: guide/composites.md
          - Parameters: guide/parameters.md
      - Measuring:
          - Sweeps: guide/sweeps.md
          - Point actions and flow control: guide/point-actions.md
          - The run queue: guide/queue.md
          - User actions: guide/user-actions.md
          - Data files: guide/data.md
      - Watching and reporting:
          - Desktop GUI: guide/gui.md
          - Plotting live and stored data: guide/plotting.md
          - Monitor and Manual panels: guide/monitor-manual.md
          - PowerPoint reports: guide/powerpoint.md
      - Remote access and the web app: guide/remote.md
      - Driver Wizard: guide/driver-wizard.md
      - Simulated instruments: guide/simulation.md
      - Robustness: guide/robustness.md
      - Testing: guide/testing.md
  - Scripting & Python:
      - scripting/index.md
      - Queue scripts: scripting/scripts.md
      - Custom sweeps: scripting/custom-sweeps.md
      - Python clients: scripting/clients.md
      - Writing a driver: scripting/writing-drivers.md
  - Supported instruments: instruments.md
  - Reference:
      - reference/index.md
      - Backend commands: reference/commands.md
      - Sweep definition: reference/sweep-format.md
      - Setup file: reference/setup-format.md
      - Script API: reference/script-api.md
      - Expressions: reference/expressions.md
      - Command line: reference/cli.md
      - Settings and files: reference/settings.md
      - Instrument drivers: reference/drivers/
      - Python API: reference/api/
