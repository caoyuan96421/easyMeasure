name: SHG add-on
on:
  push:
    paths: ['shg_addon/**', 'tests/shg/**', 'pyproject.toml', '.github/workflows/shg.yml']
  pull_request:
    paths: ['shg_addon/**', 'tests/shg/**', 'pyproject.toml', '.github/workflows/shg.yml']
jobs:
  simulated-shg:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[shg,test]"
      - run: python -m pytest tests/shg --confcutdir=tests/shg -q
        env:
          QT_QPA_PLATFORM: offscreen
